name: Build Video Event Monitor add-on
on:
  push:
    branches: [main]
    paths: ['video-event-monitor/**', '.github/workflows/video-event-monitor.yaml', 'scripts/migrate_monitor_backup.py', 'tests/test_monitor_backup_migration.py']
  pull_request:
    paths: ['video-event-monitor/**', '.github/workflows/video-event-monitor.yaml', 'scripts/migrate_monitor_backup.py', 'tests/test_monitor_backup_migration.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s video-event-monitor/tests -v
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile video-event-monitor/app/*.py
  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          version=$(awk '/^version:/ {gsub(/"/, "", $2); print $2}' video-event-monitor/config.yaml)
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: video-event-monitor
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/chronoaiproject/video-event-monitor-ha:${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify packaged runtime starts with HA options and private SQLite
        shell: bash
        run: |
          pipeline_test_dir=$(mktemp -d)
          python - "$pipeline_test_dir" <<'PY'
          import json,sys
          from pathlib import Path
          pipeline = {'version':1,'name':'image-smoke','source':{'adapter':'cloudevents',
                      'source':'urn:example:image-smoke','types':['example.event'],
                      'health':{'mode':'observed_events'}}}
          options = {'pipeline_config':json.dumps(pipeline),'api_token':'a'*48,
                     'provider_token':'p'*48,'relay_token':'r'*48,'worker_token':'w'*48}
          Path(sys.argv[1],'options.json').write_text(json.dumps(options))
          PY
          image="ghcr.io/chronoaiproject/video-event-monitor-ha:${{ steps.version.outputs.value }}"
          docker run -d --name pipeline-smoke -p 127.0.0.1:18080:8080 -v "$pipeline_test_dir:/data" "$image"
          trap 'docker logs pipeline-smoke; docker rm -f pipeline-smoke' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then
              test "$(stat -c %u "$pipeline_test_dir/state")" = 1000
              curl --fail --silent http://127.0.0.1:18080/ | grep -q 'ui/app.js'
              curl --fail --silent http://127.0.0.1:18080/ui/app.js > /dev/null
              curl --fail --silent http://127.0.0.1:18080/ui/i18n.js > /dev/null
              curl --fail --silent -H "Authorization: Bearer $(python -c 'print("a"*48)')" http://127.0.0.1:18080/api/rules | python -c 'import json,sys; assert json.load(sys.stdin)["rules"][0]["id"] == "default"'
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'X-Forwarded-For: 172.30.32.2' -H 'X-Remote-User-Id: forged' -H 'X-Ingress-Path: /api/hassio_ingress/forged' http://127.0.0.1:18080/api/rules)" = 401
              break
            fi
            sleep 2
          done
          # Supervisor restores copy files as root. Prove a subsequent boot can
          # reopen the existing registry and nested revision files after UID drop.
          docker stop pipeline-smoke
          sudo mkdir -p "$pipeline_test_dir/state/rules/restored/1"
          echo 'preserved' | sudo tee "$pipeline_test_dir/state/rules/restored/1/probe" > /dev/null
          sudo chown -R root:root "$pipeline_test_dir/state"
          docker start pipeline-smoke
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then
              test "$(stat -c %u "$pipeline_test_dir/state/monitoring.sqlite3")" = 1000
              test "$(stat -c %u "$pipeline_test_dir/state/rules/restored/1/probe")" = 1000
              test "$(sudo cat "$pipeline_test_dir/state/rules/restored/1/probe")" = preserved
              curl --fail --silent -H "Authorization: Bearer $(python -c 'print("a"*48)')" http://127.0.0.1:18080/api/rules | python -c 'import json,sys; assert json.load(sys.stdin)["rules"][0]["id"] == "default"'
              exit 0
            fi
            sleep 2
          done
          exit 1
