name: Build CMA Event Pipeline add-on
on:
  push:
    branches: [main]
    paths: ['cma-event-pipeline/**', '.github/workflows/cma-event-pipeline.yaml']
  pull_request:
    paths: ['cma-event-pipeline/**', '.github/workflows/cma-event-pipeline.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s cma-event-pipeline/tests -v
      - run: python -m py_compile cma-event-pipeline/app/*.py
  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          version=$(awk '/^version:/ {gsub(/"/, "", $2); print $2}' cma-event-pipeline/config.yaml)
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: cma-event-pipeline
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/chronoaiproject/nyx-homeassistant-cma-event-pipeline:${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
