name: "CMA Event Pipeline"
description: "Local configurable event aggregation, historical evidence selection and durable CMA delivery"
version: "0.2.2"
slug: "cma-event-pipeline"
stage: "experimental"
url: "https://github.com/ChronoAIProject/nyx-homeassistant-node/tree/main/cma-event-pipeline"
startup: "application"
boot: "auto"
arch:
  - amd64
  - aarch64
init: false
image: "ghcr.io/chronoaiproject/nyx-homeassistant-cma-event-pipeline"
options:
  pipeline_config: ""
  relay_token: ""
  api_token: ""
  provider_token: ""
  worker_token: ""
  worker_service: ""
  worker_name: "CMA Event Pipeline"
  cma_event_url: ""
  cma_hmac_key_id: ""
  cma_hmac_secret: ""
  frigate_url: ""
  frigate_api_key: ""
  heartbeat_seconds: 90
  tick_seconds: 5
  state_import_url: ""
schema:
