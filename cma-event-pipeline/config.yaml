  relay_token: password
  api_token: password
  provider_token: password
  worker_token: password
  worker_service: str
  worker_name: str
  cma_event_url: str
  cma_hmac_key_id: str
  cma_hmac_secret: password
  frigate_url: str
  frigate_api_key: password
  heartbeat_seconds: int
  tick_seconds: int
  state_import_url: str
